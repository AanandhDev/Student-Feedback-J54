<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="left">
            <h1>Course Feedback</h1>
            <p>
                We value your opinion. Please share your learning experience
                with us to help improve our courses.
            </p>

            <div class="info">
                ⭐ Your feedback matters
            </div>

            <div class="info">
                🎓 Improve future learning
            </div>

            <div class="info">
                ❤️ Thank you for your support
            </div>

        </div>

        <div class="right">

            <form id="feedbackForm">

                <div class="inputBox">
                    <label>Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>

                <div class="inputBox">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="inputBox">
                    <label>Course</label>
                    <input type="text" id="course" placeholder="Course Name">
                </div>

                <div class="inputBox">
                    <label>Rating</label>

                    <select id="rating">
                        <option value="">Choose Rating</option>
                        <option>⭐⭐⭐⭐⭐ Excellent</option>
                        <option>⭐⭐⭐⭐ Very Good</option>
                        <option>⭐⭐⭐ Good</option>
                        <option>⭐⭐ Average</option>
                        <option>⭐ Poor</option>
                    </select>

                </div>

                <div class="inputBox">
                    <label>Feedback</label>
                    <textarea id="feedback" rows="5"
                        placeholder="Write your feedback..."></textarea>
                </div>

                <button type="submit">
                    Submit Feedback
                </button>

            </form>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
