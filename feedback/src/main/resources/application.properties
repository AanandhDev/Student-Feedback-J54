spring.application.name=feedback

# Most PaaS hosts (Render, Railway, Heroku, etc.) inject PORT at runtime.
server.port=${PORT:8080}

# Falls back to local defaults for dev; set real values as env vars in production.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:host}

# ddl-auto=update is fine for now; switch to "validate" + a migration tool (Flyway/Liquibase) once the schema stabilizes.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true