spring.application.name=feedback

# Most PaaS hosts (Render, Railway, Heroku, etc.) inject PORT at runtime.
server.port=${PORT:8080}

# Falls back to local defaults for dev; on Railway these are PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:demo}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:host}

# ddl-auto=update is fine for now; switch to "validate" + a migration tool (Flyway/Liquibase) once the schema stabilizes.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true